[project]
name = "jav-tools"
version = "0.2.0"
description = "Flet desktop utilities for JAV media classification and SQLite catalog."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "drissionpage>=4.1.0.18",
    # Desktop shell (flet-desktop); avoids runtime pip install when using uv.
    "flet[desktop]>=0.27.0,<0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
